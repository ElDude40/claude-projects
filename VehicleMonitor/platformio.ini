; ESP32 Vehicle Information Monitor
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor
; Tests:   pio test -e native   (runs the OBD parser tests on your PC)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Bluetooth Classic + the display driver do not fit in the default 1.2 MB app slot.
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI@2.5.43
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; ---- TFT_eSPI configuration (replaces editing User_Setup.h) ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DDISABLE_ALL_LIBRARY_WARNINGS=1

; Host-side unit tests for the OBD-II response parsers (no hardware needed).
[env:native]
platform = native
test_build_src = yes
build_flags = -std=gnu++17
build_src_filter = -<*> +<obd_parser.cpp> +<dtc_descriptions.cpp>
